services:
  kafka-storage-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        mkdir -p /kafka-data
        chown -R 1000:1000 /kafka-data
    volumes:
      - kafka-data:/kafka-data

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-topic-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for attempt in {1..30}; do
          if /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic retailrocket-events --partitions 1 --replication-factor 1; then
            exit 0
          fi
          sleep 2
        done
        echo "Kafka topic retailrocket-events was not ready after 60 seconds." >&2
        exit 1

  spark-cache-init:
    image: apache/spark:4.2.0-scala2.13-java25-python3-ubuntu
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        mkdir -p /spark-runtime/checkpoint /spark-runtime/ivy
        if [ ! -f /spark-runtime/checkpoint/metadata ] && [ -d /checkpoint-source ]; then
          cp -a /checkpoint-source/. /spark-runtime/checkpoint/
        fi
        if [ -z "$(ls -A /spark-runtime/ivy)" ] && [ -d /ivy-source ]; then
          cp -a /ivy-source/. /spark-runtime/ivy/
        fi
        chown -R 185:185 /spark-runtime
    volumes:
      - spark-runtime-data:/spark-runtime
      - ./artifacts/spark-checkpoint:/checkpoint-source:ro
      - ./artifacts/ivy:/ivy-source:ro

  spark:
    image: apache/spark:4.2.0-scala2.13-java25-python3-ubuntu
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
      spark-cache-init:
        condition: service_completed_successfully
    working_dir: /opt/project
    volumes:
      - ./pipeline:/opt/project/pipeline:ro
      - ./artifacts:/opt/project/artifacts
      - spark-runtime-data:/spark-runtime
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: retailrocket-events
      ARTIFACTS_DIR: /opt/project/artifacts
      SPARK_CHECKPOINT: /spark-runtime/checkpoint-recovered
      SPARK_TRIGGER: 2 seconds
      SPARK_MAX_OFFSETS_PER_TRIGGER: 500
      SPARK_HEARTBEAT_INTERVAL_SECONDS: 5
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[1]
      - --driver-memory
      - 512m
      - --conf
      - spark.jars.ivy=/spark-runtime/ivy
      - --conf
      - spark.jars.excludes=org.apache.hadoop:hadoop-client-api,org.apache.hadoop:hadoop-client-runtime
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      - /opt/project/pipeline/spark_processor.py
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import json,datetime,pathlib,sys; h=json.loads(pathlib.Path('/opt/project/artifacts/spark-heartbeat.json').read_text()); s=json.loads(pathlib.Path('/opt/project/artifacts/spark.json').read_text()); t=datetime.datetime.fromisoformat(h['heartbeat_at']); fresh=(datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()<20; sys.exit(0 if fresh and s.get('status')=='running' else 1)"
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 300s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      spark:
        condition: service_started
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
      KAFKA_TOPIC: retailrocket-events
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
    command:
      - python
      - -m
      - streamlit
      - run
      - app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  kafka-data:
  spark-runtime-data:
